name: CI (main)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------- Backend
  api:
    name: API · pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
        env:
          USE_OCR_MOCK: "true"
          DATABASE_URL: "sqlite:///:memory:"

  # ------------------------------------------------------------------- Web
  web:
    name: Web · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  # ---------------------------------------------------------------- Mobile
  mobile:
    name: Mobile · test + bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Metro observa la raíz del repo — su node_modules debe existir.
      - run: npm install --no-audit --no-fund
      # Las libs compartidas traen sus propias deps (no hay workspace en main).
      - run: npm install --no-audit --no-fund
        working-directory: packages/shared-schemas
      - run: npm install --no-audit --no-fund --omit=peer
        working-directory: packages/mobile-shared
      - run: npm ci --no-audit --no-fund
        working-directory: apps/mobile
      - run: npm test -- --ci
        working-directory: apps/mobile
      - run: npx --yes expo-doctor@latest
        working-directory: apps/mobile
      - name: Metro bundle (iOS + web)
        working-directory: apps/mobile
        run: |
          CI=1 npx expo export --platform ios --output-dir /tmp/e-ios
          CI=1 npx expo export --platform web --output-dir /tmp/e-web
