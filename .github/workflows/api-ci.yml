name: API CI

on:
  push:
    branches: [api]
  pull_request:
    branches: [api, main]
    paths:
      - "apps/api/**"
      - "apps/ocr/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
        env:
          USE_OCR_MOCK: "true"
          DATABASE_URL: "sqlite:///:memory:"

  ocr-pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ocr
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/ocr/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
        env:
          USE_OCR_MOCK: "true"
