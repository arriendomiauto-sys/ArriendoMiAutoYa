# Configuración de Alembic para RentACar API.
# Un solo "script_location": nuestra carpeta alembic/ con env.py y versions/.

[alembic]
# Carpeta con env.py, script.py.mako y versions/.
script_location = alembic

# La URL de conexión NO se declara acá a propósito: la inyecta
# alembic/env.py desde app.core.config.settings.DATABASE_URL (la misma fuente
# que app/core/database.py), así no se duplica la cadena de conexión ni se
# versionan credenciales. Dejarla en blanco/comentada evita pisar el valor que
# viene del Settings (.env) o de las variables de entorno de producción.
# sqlalchemy.url =

# Si algún día se necesita forzar otra URL desde CLI (p. ej. probar la
# baseline contra el SQLite local):
#   alembic -x address="sqlite:///./rentacar_dev.db" upgrade head
# (requiere implementar la lectura de -x en env.py)

# Logging básico (mismo bloque estándar de cualquier alembic.ini reciente).
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S